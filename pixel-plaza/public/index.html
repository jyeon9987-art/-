<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>픽셀광장</title>
  <meta name="description" content="나만의 픽셀 캐릭터로 모여 수다 떠는 온라인 광장">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="overlay"></canvas>

  <div id="hud" hidden>
    <div id="roomBadge"><b id="roomName"></b><span id="roomCount"></span></div>
    <button id="btnDress" type="button">옷 갈아입기</button>
  </div>

  <div id="chat" hidden>
    <div id="log" aria-live="polite"></div>
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="80" placeholder="메시지를 입력하세요" enterkeyhint="send">
      <button type="submit">보내기</button>
    </form>
  </div>

  <div id="creator" class="modal">
    <div class="panel">
      <h1>픽셀광장</h1>
      <p class="tagline" id="creatorHint">나만의 캐릭터를 만들고 입장하세요</p>
      <div class="creator-body">
        <div class="preview-col">
          <canvas id="preview" width="50" height="53"></canvas>
          <button id="btnRandom" type="button" class="ghost">🎲 랜덤</button>
          <label id="nameRow">닉네임
            <input id="nameInput" maxlength="10" placeholder="최대 10자">
          </label>
        </div>
        <div class="options" id="options"></div>
      </div>
      <button id="btnEnter" type="button" class="primary">입장하기</button>
      <p class="status" id="status"></p>
    </div>
  </div>

  <div id="lost" class="modal" hidden>
    <div class="panel small">
      <p>서버와 연결이 끊겼어요.</p>
      <button type="button" class="primary" onclick="location.reload()">다시 접속</button>
    </div>
  </div>

  <script src="spec.js"></script>
  <script src="avatar.js"></script>
  <script src="scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
